# ============================================================
# FastEasy - Configuração da aplicação
# Credenciais são lidas de variáveis de ambiente (ver .env.example).
# ============================================================

spring.application.name=FastEasy

# --- Banco de dados PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fasteasy}
spring.datasource.username=${DB_USER:fasteasy}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- JavaFX ---
fasteasy.window.title=FastEasy - Gestão de Supermercado
fasteasy.window.width=1280
fasteasy.window.height=800

# --- Logging ---
logging.level.root=INFO
logging.level.com.fasteasy=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
